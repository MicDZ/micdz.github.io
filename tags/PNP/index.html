        <script>
          var systemDarkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
          function systemPrefersDark() { return !!(systemDarkQuery && systemDarkQuery.matches); }
          function readStoredTheme() {
            try { return localStorage.getItem('preferredTheme'); } catch (e) { return null; }
          }
          function applyTheme() {
            var stored = readStoredTheme();
            var isDark = stored === 'dark' || (stored !== 'light' && systemPrefersDark());
            document.body.classList.toggle('darkmode', isDark);
            syncModeButtons();
          }
          // 手动切换：与系统设置一致时清除记录，恢复“跟随系统”；否则记住用户的选择
          function setDarkMode(isDark) {
            try {
              if (isDark === systemPrefersDark()) localStorage.removeItem('preferredTheme');
              else localStorage.setItem('preferredTheme', isDark ? 'dark' : 'light');
            } catch (e) {}
            document.body.classList.toggle('darkmode', isDark);
            syncModeButtons();
          }
          function syncModeButtons() {
            var isDark = document.body.classList.contains('darkmode');
            var darkBtn = document.getElementById('darkBtn');
            var lightBtn = document.getElementById('lightBtn');
            if (darkBtn) darkBtn.classList.toggle('hidden', isDark);
            if (lightBtn) lightBtn.classList.toggle('hidden', !isDark);
          }
          syncModeButtons();
          // 系统主题变化时（且用户未手动选择）实时跟随
          if (systemDarkQuery) {
            var onSystemChange = function () { if (!readStoredTheme()) applyTheme(); };
            if (systemDarkQuery.addEventListener) systemDarkQuery.addEventListener('change', onSystemChange);
            else if (systemDarkQuery.addListener) systemDarkQuery.addListener(onSystemChange);
          }
          // 多标签页之间同步主题
          window.addEventListener('storage', function (e) {
            if (e.key === 'preferredTheme') applyTheme();
          });
        </script>
